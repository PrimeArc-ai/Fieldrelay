services:
  - type: web
    name: fieldrelay-api
    runtime: python
    plan: free
    buildCommand: python -m pip install --upgrade pip && pip install --only-binary=:all: -r backend/requirements.txt
    startCommand: PYTHONPATH=backend uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: FIELDRELAY_ENV
        value: poc
      - key: DATABASE_URL
        value: sqlite:////tmp/fieldrelay.db
      - key: CORS_ORIGINS
        value: "*"
      - key: SUPPORTED_ZIPS
        value: 560001,560002,560003,560004
      - key: VAPI_PUBLIC_KEY
        sync: false
      - key: VAPI_PRIVATE_KEY
        sync: false

  - type: web
    name: fieldrelay-web
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: BACKEND_URL
        sync: false
